# Local development profile (also used by docker-compose).
# Database defaults match the local dev container and are NOT secrets.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autoservice}
    username: ${DB_USERNAME:autoservice}
    password: ${DB_PASSWORD:autoservice}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    io.github.cerneabogdanandrei.autoservice: debug
