# Base configuration shared by every environment.
# Environment-specific values come exclusively from environment variables;
# there are no defaults for credentials or secrets here.
spring:
  application:
    name: auto-service-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto
  mvc:
    problemdetails:
      enabled: true

app:
  security:
    jwt:
      # Required; no default on purpose. At least 32 bytes, e.g. `openssl rand -base64 48`.
      secret: ${JWT_SECRET:}
      issuer: auto-service-api
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
