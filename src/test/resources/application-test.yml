# Test profile. The datasource is provided by Testcontainers through @ServiceConnection,
# so no connection settings are needed here.
spring:
  main:
    banner-mode: off
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    root: warn
    io.github.cerneabogdanandrei.autoservice: info
    org.testcontainers: info
