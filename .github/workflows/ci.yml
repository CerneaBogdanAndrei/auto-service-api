name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Unlike setup-java's built-in cache, restore-keys reuse the previous cache when pom.xml
      # changes, so only new dependencies are downloaded (Maven Central rate-limits shared runners).
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Runs unit tests (Surefire) and integration tests (Failsafe + Testcontainers).
      # Docker is available on GitHub-hosted Ubuntu runners. The resolver retries
      # 429/503 responses from Maven Central with a back-off instead of failing the build.
      - name: Build and run all tests
        run: >-
          ./mvnw -B -ntp verify
          -Daether.connector.http.retryHandler.count=6
          -Daether.connector.http.retryHandler.interval=10000

      - name: Coverage summary
        if: always()
        run: |
          summarize() {  # $1 = jacoco.csv, $2 = label, $3 = class-name filter (regex)
            [ -f "$1" ] || return 0
            awk -F, -v label="$2" -v filter="$3" 'NR > 1 && $3 ~ filter { missed += $8; covered += $9 }
              END { if (missed + covered > 0) printf "| %s | %.1f%% |\n", label, 100 * covered / (missed + covered) }' "$1"
          }
          {
            echo "### Line coverage"
            echo "| Scope | Lines |"
            echo "|---|---|"
            summarize target/site/jacoco-unit/jacoco.csv "Service layer (unit tests, gated at 80%)" 'Service$'
            summarize target/site/jacoco/jacoco.csv "Whole application (unit + integration tests)" '.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            target/site/jacoco/
            target/site/jacoco-unit/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
